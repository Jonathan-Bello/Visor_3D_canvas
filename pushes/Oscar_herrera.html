<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Cube</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #111827;
      --cube-front: #60a5fa;
      --cube-back: #a78bfa;
      --cube-right: #34d399;
      --cube-left: #fbbf24;
      --cube-top: #f472b6;
      --cube-bottom: #fb7185;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at center, var(--bg2), var(--bg1));
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .scene {
      width: 220px;
      height: 220px;
      perspective: 800px;
      display: grid;
      place-items: center;
    }

    .cube {
      position: relative;
      width: 120px;
      height: 120px;
      transform-style: preserve-3d;
      animation: spin 8s linear infinite;
    }

    .face {
      position: absolute;
      width: 120px;
      height: 120px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      display: grid;
      place-items: center;
      font-size: 3rem;
      color: rgba(255, 255, 255, 0.9);
      box-shadow: inset 0 0 30px rgba(255,255,255,0.12);
      backdrop-filter: blur(1px);
    }

    .front  { transform: translateZ(60px); background: var(--cube-front); }
    .back   { transform: rotateY(180deg) translateZ(60px); background: var(--cube-back); }
    .right  { transform: rotateY(90deg) translateZ(60px); background: var(--cube-right); }
    .left   { transform: rotateY(-90deg) translateZ(60px); background: var(--cube-left); }
    .top    { transform: rotateX(90deg) translateZ(60px); background: var(--cube-top); }
    .bottom { transform: rotateX(-90deg) translateZ(60px); background: var(--cube-bottom); }

    @keyframes spin {
      0%   { transform: rotateX(-22deg) rotateY(0deg); }
      25%  { transform: rotateX(22deg) rotateY(90deg); }
      50%  { transform: rotateX(-22deg) rotateY(180deg); }
      75%  { transform: rotateX(22deg) rotateY(270deg); }
      100% { transform: rotateX(-22deg) rotateY(360deg); }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="cube">
      <div class="face front">1</div>
      <div class="face back">2</div>
      <div class="face right">3</div>
      <div class="face left">4</div>
      <div class="face top">5</div>
      <div class="face bottom">6</div>
    </div>
  </div>
</body>
</html>
