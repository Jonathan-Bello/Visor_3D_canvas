<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cubo 3D en HTML y CSS</title>
  <style>
    /* Estilos generales de la página */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Escena 3D (define la perspectiva) */
    .scene {
      width: 200px;
      height: 200px;
      perspective: 1000px;
    }

    /* Contenedor del cubo */
    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: rotateCube 12s infinite linear;
      transition: transform 0.5s ease;
    }

    /* Pausa la animación y agranda el cubo al pasar el mouse */
    .scene:hover .cube {
      animation-play-state: paused;
      transform: scale(1.1) rotateX(-20deg) rotateY(25deg);
    }

    /* Estilo común para cada una de las 6 caras */
    .face {
      position: absolute;
      width: 200px;
      height: 200px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: white;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      border-radius: 12px;
      backdrop-filter: blur(4px);
      box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.2),
                  0 0 20px rgba(0, 0, 0, 0.3);
    }

    /* Posicionamiento y color de cada cara (100px = la mitad del ancho de 200px) */
    .front  { transform: rotateY(  0deg) translateZ(100px); background: rgba(239, 68, 68, 0.85); }
    .back   { transform: rotateY(180deg) translateZ(100px); background: rgba(59, 130, 246, 0.85); }
    .right  { transform: rotateY( 90deg) translateZ(100px); background: rgba(34, 197, 94, 0.85); }
    .left   { transform: rotateY(-90deg) translateZ(100px); background: rgba(234, 179, 8, 0.85); }
    .top    { transform: rotateX( 90deg) translateZ(100px); background: rgba(168, 85, 247, 0.85); }
    .bottom { transform: rotateX(-90deg) translateZ(100px); background: rgba(236, 72, 153, 0.85); }

    /* Animación de rotación continua en el espacio 3D */
    @keyframes rotateCube {
      0% {
        transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg);
      }
      100% {
        transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg);
      }
    }
  </style>
</head>
<body>

  <!-- Escena principal -->
  <div class="scene">
    <!-- Cubo 3D -->
    <div class="cube">
      <div class="face front">Frente</div>
      <div class="face back">Atrás</div>
      <div class="face right">Derecha</div>
      <div class="face left">Izquierda</div>
      <div class="face top">Arriba</div>
      <div class="face bottom">Abajo</div>
    </div>
  </div>

</body>
</html>
