```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triángulo 3D editable</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  text-align: center;
}

h1 {
  padding-top: 20px;
}

canvas {
  width: 90%;
  max-width: 800px;
  height: 450px;
  display: block;
  margin: auto;
  border: 1px solid #34445c;
  border-radius: 12px;
  touch-action: none;
}

.controls {
  max-width: 650px;
  margin: 20px auto;
  padding: 20px;
  background: #1b2638;
  border-radius: 12px;
}

.row {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin: 12px;
}

label {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

input, select {
  width: 90px;
  padding: 7px;
  border-radius: 5px;
}

button {
  padding: 10px 15px;
  margin: 5px;
  cursor: pointer;
  border: 0;
  border-radius: 7px;
  background: #42c9f5;
  color: #101827;
  font-weight: bold;
}

p {
  color: #c4d0e2;
}
</style>
</head>

<body>

<h1>Triángulo 3D editable</h1>
<p>Arrastra la vista para girarla y modifica los vértices.</p>

<canvas id="scene"></canvas>

<div class="controls">

  <h2>Seleccionar vértice</h2>

  <select id="vertex">
    <option value="0">Vértice A</option>
    <option value="1">Vértice B</option>
    <option value="2">Vértice C</option>
  </select>

  <div class="row">
    <label>X
      <input id="x" type="number" step="0.1" value="-1">
    </label>

    <label>Y
      <input id="y" type="number" step="0.1" value="-1">
    </label>

    <label>Z
      <input id="z" type="number" step="0.1" value="0">
    </label>
  </div>

  <button id="apply">Modificar vértice</button>
  <button id="reset">Restaurar triángulo</button>

  <h2>Grosor de la figura</h2>

  <div class="row">
    <label>Profundidad
      <input id="depth" type="number"
        min="0.1" max="5" step="0.1" value="0.8">
    </label>
  </div>

  <h2>Rotación</h2>

  <div class="row">
    <label>Rotación X
      <input id="rx" type="range"
        min="-180" max="180" value="0">
    </label>

    <label>Rotación Y
      <input id="ry" type="range"
        min="-180" max="180" value="0">
    </label>

    <label>Rotación Z
      <input id="rz" type="range"
        min="-180" max="180" value="0">
    </label>
  </div>

  <p id="status">Selecciona un vértice para editarlo.</p>

</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ESCENA
const canvas = document.getElementById('scene');

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101827);

const camera = new THREE.PerspectiveCamera(
  45, 1, 0.1, 100
);

camera.position.set(4, 3, 6);
camera.lookAt(0, 0, 0);

// ILUMINACIÓN
scene.add(
  new THREE.AmbientLight(0xffffff, 1.2)
);

const light = new THREE.DirectionalLight(
  0xffffff, 3
);

light.position.set(4, 6, 5);
scene.add(light);

// LUZ ADICIONAL PARA ILUMINAR LOS LADOS
const fillLight = new THREE.DirectionalLight(
  0x78bfff, 1.5
);

fillLight.position.set(-4, 2, -5);
scene.add(fillLight);

// VÉRTICES INICIALES
const initial = [
  [-1, -1, 0],
  [ 1, -1, 0],
  [ 0,  1, 0]
];

let vertices = initial.map(v => [...v]);

let depth = 0.8;

// GRUPO 3D
const object = new THREE.Group();
scene.add(object);

// GEOMETRÍA CON VOLUMEN
const geometry = new THREE.BufferGeometry();

const material = new THREE.MeshStandardMaterial({
  color: 0x16c7e8,
  side: THREE.DoubleSide,
  roughness: 0.32,
  metalness: 0.12,
  flatShading: true
});

const solid = new THREE.Mesh(geometry, material);

solid.castShadow = true;
solid.receiveShadow = true;

object.add(solid);

// BORDES BLANCOS
const edgeGeometry = new THREE.BufferGeometry();

const edgeLines = new THREE.LineSegments(
  edgeGeometry,
  new THREE.LineBasicMaterial({
    color: 0xffffff
  })
);

object.add(edgeLines);

// PUNTOS DE LOS VÉRTICES
const pointGeometry = new THREE.BufferGeometry();

const pointCloud = new THREE.Points(
  pointGeometry,
  new THREE.PointsMaterial({
    color: 0xffd166,
    size: 0.14,
    sizeAttenuation: true
  })
);

object.add(pointCloud);

// VÉRTICE SELECCIONADO
const selectedGeometry = new THREE.BufferGeometry();

const selectedPoint = new THREE.Points(
  selectedGeometry,
  new THREE.PointsMaterial({
    color: 0xff5263,
    size: 0.23,
    sizeAttenuation: true
  })
);

object.add(selectedPoint);

// CUADRÍCULA
const grid = new THREE.GridHelper(
  10, 20, 0x47617e, 0x26384d
);

grid.position.y = -1.5;
scene.add(grid);

// EJES DE REFERENCIA
const axes = new THREE.AxesHelper(2);
scene.add(axes);

// CREAR PRISMA TRIANGULAR
function rebuild() {
  const back = vertices.map(v => [
    v[0],
    v[1],
    v[2] - depth
  ]);

  const front = vertices;

  const A = front[0];
  const B = front[1];
  const C = front[2];

  const A2 = back[0];
  const B2 = back[1];
  const C2 = back[2];

  // Cada tres puntos forman un triángulo.
  // Se crean dos caras triangulares y tres caras laterales.
  const faces = [
    // Cara frontal
    A, B, C,

    // Cara trasera con orientación invertida
    C2, B2, A2,

    // Lateral AB
    A, A2, B,
    B, A2, B2,

    // Lateral BC
    B, B2, C,
    C, B2, C2,

    // Lateral CA
    C, C2, A,
    A, C2, A2
  ];

  const positions = [];

  faces.forEach(face => {
    face.forEach(vertex => {
      positions.push(...vertex);
    });
  });

  geometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(positions, 3)
  );

  geometry.computeVertexNormals();

  // Bordes frontales, traseros y de profundidad
  const edges = [
    // Frente
    ...A, ...B,
    ...B, ...C,
    ...C, ...A,

    // Parte trasera
    ...A2, ...B2,
    ...B2, ...C2,
    ...C2, ...A2,

    // Uniones de profundidad
    ...A, ...A2,
    ...B, ...B2,
    ...C, ...C2
  ];

  edgeGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(edges, 3)
  );

  pointGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(
      [...front, ...back].flat(), 3
    )
  );

  const i = Number(
    document.getElementById('vertex').value
  );

  selectedGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(front[i], 3)
  );

  geometry.computeBoundingSphere();
  edgeGeometry.computeBoundingSphere();
  pointGeometry.computeBoundingSphere();
  selectedGeometry.computeBoundingSphere();
}

// CARGAR COORDENADAS
function loadCoordinates() {
  const i = Number(
    document.getElementById('vertex').value
  );

  document.getElementById('x').value = vertices[i][0];
  document.getElementById('y').value = vertices[i][1];
  document.getElementById('z').value = vertices[i][2];
}

document.getElementById('vertex')
  .addEventListener('change', () => {
    loadCoordinates();
    rebuild();
  });

// MODIFICAR VÉRTICE
document.getElementById('apply')
  .addEventListener('click', () => {
    const i = Number(
      document.getElementById('vertex').value
    );

    const coords = ['x', 'y', 'z'].map(id =>
      Number(document.getElementById(id).value)
    );

    if (!coords.every(Number.isFinite)) {
      document.getElementById('status').textContent =
        'Introduce coordenadas válidas.';
      return;
    }

    vertices[i] = coords;

    rebuild();
    loadCoordinates();

    document.getElementById('status').textContent =
      'Vértice modificado correctamente.';
  });

// MODIFICAR GROSOR
document.getElementById('depth')
  .addEventListener('input', event => {
    const value = Number(event.target.value);

    if (!Number.isFinite(value) || value <= 0) {
      return;
    }

    depth = Math.min(value, 5);
    rebuild();

    document.getElementById('status').textContent =
      'Profundidad actualizada.';
  });

// RESTAURAR FIGURA
document.getElementById('reset')
  .addEventListener('click', () => {
    vertices = initial.map(v => [...v]);
    depth = 0.8;

    object.rotation.set(0, 0, 0);

    document.getElementById('depth').value = depth;

    ['rx', 'ry', 'rz'].forEach(id => {
      document.getElementById(id).value = 0;
    });

    document.getElementById('vertex').value = '0';

    loadCoordinates();
    rebuild();

    document.getElementById('status').textContent =
      'Triángulo 3D restaurado.';
  });

// ROTACIÓN X, Y, Z
[['rx', 'x'], ['ry', 'y'], ['rz', 'z']]
  .forEach(([id, axis]) => {
    document.getElementById(id)
      .addEventListener('input', event => {
        object.rotation[axis] =
          THREE.MathUtils.degToRad(
            Number(event.target.value)
          );
      });
  });

// GIRAR CÁMARA CON EL RATÓN
let dragging = false;
let oldX = 0;
let oldY = 0;

let theta = Math.atan2(
  camera.position.x, camera.position.z
);

let phi = Math.acos(
  camera.position.y / camera.position.length()
);

const target = new THREE.Vector3(0, 0, 0);

canvas.addEventListener('pointerdown', e => {
  dragging = true;
  oldX = e.clientX;
  oldY = e.clientY;

  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', e => {
  if (!dragging) return;

  theta -= (e.clientX - oldX) * 0.008;
  phi -= (e.clientY - oldY) * 0.008;

  phi = Math.max(
    0.15,
    Math.min(Math.PI - 0.15, phi)
  );

  oldX = e.clientX;
  oldY = e.clientY;

  const r = camera.position.distanceTo(target);

  camera.position.set(
    r * Math.sin(phi) * Math.sin(theta),
    r * Math.cos(phi),
    r * Math.sin(phi) * Math.cos(theta)
  );

  camera.lookAt(target);
});

canvas.addEventListener('pointerup', () => {
  dragging = false;
});

canvas.addEventListener('pointercancel', () => {
  dragging = false;
});

// AJUSTAR TAMAÑO
function resize() {
  const rect = canvas.getBoundingClientRect();

  renderer.setSize(rect.width, rect.height, false);

  camera.aspect = rect.width / rect.height;
  camera.updateProjectionMatrix();
}

window.addEventListener('resize', resize);

// INICIAR
rebuild();
loadCoordinates();
resize();

// ANIMACIÓN
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}

animate();
</script>

</body>
</html>
```
