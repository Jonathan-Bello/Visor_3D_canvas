<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodecaedro 3D</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #202530;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

<script type="module">
    import * as THREE from
        'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

    // 1. Crear la escena
    const escena = new THREE.Scene();
    escena.background = new THREE.Color(0x202530);

    // 2. Crear la cámara
    const camara = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        100
    );

    camara.position.z = 4;

    // 3. Crear el renderizador
    const renderizador = new THREE.WebGLRenderer({
        antialias: true
    });

    renderizador.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderizador.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    document.body.appendChild(renderizador.domElement);

    // 4. Crear la geometría del dodecaedro
    const geometria = new THREE.DodecahedronGeometry(1.3, 0);

    // 5. Crear el material
    const material = new THREE.MeshStandardMaterial({
        color: 0x00ff00,
        roughness: 0.4,
        metalness: 0.15,
        flatShading: true
    });

    // 6. Crear el objeto 3D
    const dodecaedro = new THREE.Mesh(
        geometria,
        material
    );

    escena.add(dodecaedro);

    // 7. Añadir iluminación
    const luzPrincipal = new THREE.DirectionalLight(
        0xffffff,
        3
    );

    luzPrincipal.position.set(3, 4, 5);
    escena.add(luzPrincipal);

    const luzAmbiente = new THREE.AmbientLight(
        0xffffff,
        1
    );

    escena.add(luzAmbiente);

    // 8. Animar el dodecaedro
    function animar() {
        requestAnimationFrame(animar);

        dodecaedro.rotation.x += 0.005;
        dodecaedro.rotation.y += 0.008;

        renderizador.render(escena, camara);
    }

    animar();

    // 9. Adaptar el dibujo al tamaño de la ventana
    window.addEventListener('resize', () => {
        camara.aspect =
            window.innerWidth / window.innerHeight;

        camara.updateProjectionMatrix();

        renderizador.setSize(
            window.innerWidth,
            window.innerHeight
        );
    });
</script>

</body>
</html>
